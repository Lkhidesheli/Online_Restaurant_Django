{% load static %}<!doctype html>
<html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="ონლაინ რესტორანი — შეარჩიე კერძები და შეავსე შენი კალათა."><title>{% block title %}სუფრა • ონლაინ რესტორანი{% endblock %}</title><link rel="stylesheet" href="{% static 'restaurant/styles.css' %}"><script src="{% static 'restaurant/app.js' %}" defer></script></head>
<body><a class="skip" href="#main">შინაარსზე გადასვლა</a><header><a class="brand" href="{% url 'restaurant:menu' %}">სუფრა<span>ONLINE RESTAURANT</span></a><nav aria-label="მთავარი ნავიგაცია"><a href="{% url 'restaurant:menu' %}" {% if request.resolver_match.url_name == 'menu' %}aria-current="page"{% endif %}>მენიუ</a><a href="{% url 'restaurant:cart' %}" {% if request.resolver_match.url_name == 'cart' %}aria-current="page"{% endif %}>კალათა <span class="badge" data-cart-count>{{ cart_count }}</span></a></nav></header>
<main id="main">{% for message in messages %}<p class="notice" role="status">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main><footer><span>სუფრა / გემო, რომელიც გახსოვს.</span><span>ონლაინ რესტორანი</span></footer><div id="toast" class="toast" role="status" hidden></div></body></html>
